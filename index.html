<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Page</title>
    <style>
        /* Общие стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: background 0.5s;
        }

        /* Главная страница */
        #main-screen {
            background-color: #ffccd5;
            width: 100%
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            color: #d63384;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
        }

        #no {
            background-color: black;
            color: white;
        }

        /* Сердечки */
        .heart {
            position: absolute;
            font-size: 24px;
            color: red;
            animation: fall linear infinite;
        }

        @keyframes fall {
            from {
                transform: translateY(-10%);
                opacity: 1;
            }
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* Страница "Да" */
        #yes-screen {
            display: none;
            background-color: #ffccd5;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: absolute;
        }

        /* Страница 404 */
        #error-screen {
            display: none;
            background-color: black;
            color: white;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: absolute;
        }

        #error-screen h1, #error-screen p {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Главный экран -->
    <div id="main-screen">
        <h1>Ты согласна?</h1>
        <div class="buttons">
            <button id="yes">Да</button>
            <button id="no">Нет</button>
        </div>
    </div>

    <!-- Экран "Да" -->
    <div id="yes-screen">
        <h1>Спасибо! ❤️</h1>
    </div>

    <!-- Ошибка 404 -->
    <div id="error-screen">
        <h1>Ошибка 404</h1>
        <p>Ты отказалась... и теперь здесь пустота :(</p>
    </div>

    <script>
        // Функция для переключения экранов
        function showScreen(screenId) {
            document.getElementById("main-screen").style.display = "none";
            document.getElementById("yes-screen").style.display = "none";
            document.getElementById("error-screen").style.display = "none";

            document.getElementById(screenId).style.display = "flex";
        }

        // Обработчики кнопок
        document.getElementById("yes").addEventListener("click", function () {
            showScreen("yes-screen");
            startHearts();
        });

        document.getElementById("no").addEventListener("click", function () {
            showScreen("error-screen");
        });

        // Функция создания падающих сердечек
        function createHeart() {
            const heart = document.createElement("div");
            heart.innerHTML = "❤️";heart.classList.add("heart");
            document.body.appendChild(heart);

            const size = Math.random() * 20 + 10;
            heart.style.fontSize = size + "px";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Запускаем сердечки только на нужных экранах
        function startHearts() {
            setInterval(createHeart, 300);
        }

        // Запуск сердечек на главном экране
        startHearts();
    </script>
</body>
</html>
