<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TelegramShop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-weight: 200;
            color: var(--tg-theme-text-color);
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        #main, #emojiPage, #errorPage {
            width: 90%;
            padding: 10%;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        button {
            border: 0;
            margin-top: 15px;
            height: 45px;
            width: 150px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 500ms ease;
            color: #ffffff;
            background: #ff7e5f;
            border-radius: 25px;
        }

        button:hover {
            background: #feb47b;
        }

        #errorPage {
            background-color: black;
            color: white;
        }

    </style>
</head>
<body>
    <div id="main">
        <h1>Welcome to the Store</h1>
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <div id="emojiPage" style="display:none;">
        <h1>New Page Content</h1>
        <p>This is the content that appears when you press "Yes".</p>
    </div>

    <div id="errorPage" style="display:none;">
        <h1>Error 404: Page Not Found</h1>
        <p>The page you are looking for doesn't exist.</p>
    </div>

    <script>
        const yesButton = document.getElementById('yesBtn');
        const noButton = document.getElementById('noBtn');
        const mainPage = document.getElementById('main');
        const emojiPage = document.getElementById('emojiPage');
        const errorPage = document.getElementById('errorPage');

        yesButton.addEventListener('click', () => {
            mainPage.style.display = 'none';
            emojiPage.style.display = 'block';
        });

        noButton.addEventListener('click', () => {
            mainPage.style.display = 'none';
            errorPage.style.display = 'block';
        });
    </script>
</body>
</html>
